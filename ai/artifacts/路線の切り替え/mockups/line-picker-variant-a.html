<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>路線選択 — 変体A（線だけ・軽い）</title>
<link rel="stylesheet" href="../../../../css/style.css">
<style>
  body {
    margin: 0;
    background: var(--land-0);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
    color: var(--ink);
  }
  .sheet { max-width: 430px; margin: 0 auto; min-height: 100vh; padding: 40px 20px 32px; box-sizing: border-box; }

  .lead-title { font-size: 24px; font-weight: 700; margin: 0 0 8px; letter-spacing: 0.02em; }
  .lead-note  { font-size: 13px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 32px; }

  .line-card {
    display: block; width: 100%; box-sizing: border-box;
    padding: 20px; margin: 0 0 16px;
    border: none; border-radius: var(--radius);
    background: rgba(255,255,255,0.82);
    box-shadow: 0 4px 18px rgba(0,0,0,0.14);
    cursor: pointer; text-align: left;
    font: inherit; color: inherit;
    transition: transform 0.1s ease;
  }
  .line-card:active { transform: scale(0.985); }

  .line-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .line-card-name { font-size: 20px; font-weight: 700; }
  .line-card-meta { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }

  /* 試験用の路線であることの印。作品の路線と同じ重みに見せない */
  .line-card-badge {
    font-size: 11px; font-weight: 600;
    color: var(--ink-soft);
    border: 1px solid var(--ink-soft);
    border-radius: 999px; padding: 2px 8px;
  }
  .line-card--test { opacity: 0.86; }

  .preview {
    display: block; width: 100%; height: 148px;
    background: var(--land-0);
    border-radius: 8px;
  }
  /*
   * viewBox は緯度経度（0.02 くらいの値）なので、stroke-width をそのまま px の
   * つもりで書くと画面の何十倍もの太さになる。non-scaling-stroke を付けると、
   * 線の太さだけが座標系から外れて画面上の px で効く。
   */
  .preview-rail,
  .preview-halo,
  .preview-stop { vector-effect: non-scaling-stroke; }

  .preview-rail { fill: none; stroke: var(--rail); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .preview-halo { fill: none; stroke: rgba(255,255,255,0.8); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .preview-stop { fill: var(--station); stroke: var(--rail); stroke-width: 1.2; }
  .preview-end  { fill: var(--rail); }

  .foot { font-size: 12px; color: var(--ink-soft); line-height: 1.7; margin-top: 24px; }
</style>
</head>
<body>
<div class="sheet">
  <h1 class="lead-title">どの路線を見ますか？</h1>
  <p class="lead-note">
    変体A ─ プレビューは <strong>線路と駅だけ</strong>。読むのは <code>route.json</code> のみ（二路線あわせて 35 KB）。
    地形も陰影も読まないので、開始画面がいちばん軽い。
  </p>

  <div id="cards"></div>

  <p class="foot" id="weight">読み込み量を計測中…</p>
</div>

<script>
/*
 * 路線の形だけを描く。緯度経度をそのまま使うと日本の緯度では横に間延びするので、
 * 経度側に cos(緯度) を掛けて実際の比率に直す（js/main.js の考え方と同じ）。
 */
function previewSvg(route) {
  const b = route.bounds;
  const k = Math.cos(((b.minLat + b.maxLat) / 2) * Math.PI / 180);
  const x = (lon) => (lon - b.minLon) * k;
  const y = (lat) => (b.maxLat - lat);
  const w = x(b.maxLon), h = y(b.minLat);
  const pad = Math.max(w, h) * 0.06;

  const d = route.track.map(([lat, lon], i) =>
    (i === 0 ? 'M' : 'L') + x(lon).toFixed(5) + ' ' + y(lat).toFixed(5)).join(' ');

  const stops = route.stations.map((s, i) => {
    const isEnd = i === 0 || i === route.stations.length - 1;
    const r = (isEnd ? 0.010 : 0.006) * Math.max(w, h);
    return `<circle class="preview-stop${isEnd ? ' preview-end' : ''}" cx="${x(s.lon).toFixed(5)}" cy="${y(s.lat).toFixed(5)}" r="${r.toFixed(5)}"/>`;
  }).join('');

  return `<svg class="preview" viewBox="${-pad} ${-pad} ${w + pad * 2} ${h + pad * 2}"
               preserveAspectRatio="xMidYMid meet" role="img"
               aria-label="${route.lineName || ''}の路線の形">
            <path class="preview-halo" d="${d}"/><path class="preview-rail" d="${d}"/>${stops}
          </svg>`;
}

let bytes = 0;

async function load(path) {
  const res = await fetch('/' + path);
  const text = await res.text();
  bytes += text.length;
  return JSON.parse(text);
}

(async () => {
  const registry = await load('data/lines.json');
  const cards = document.getElementById('cards');

  for (const line of registry.lines) {
    const route = await load(line.dir + '/route.json');
    const km = (route.totalLength / 1000).toFixed(1);

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'line-card' + (line.role === 'test' ? ' line-card--test' : '');
    card.innerHTML =
      `<div class="line-card-head">
         <span class="line-card-name">${line.name}</span>
         ${line.role === 'test' ? '<span class="line-card-badge">試験用</span>' : ''}
       </div>
       <p class="line-card-meta">${km} km ・ ${route.stations.length} 駅 ・ ${route.stations[0].name} 〜 ${route.stations[route.stations.length - 1].name}</p>
       ${previewSvg(route)}`;
    card.addEventListener('click', () => {
      location.href = '/?line=' + line.id;
    });
    cards.appendChild(card);
  }

  document.getElementById('weight').textContent =
    `この画面が読んだ量: ${(bytes / 1024).toFixed(0)} KB（陰影起伏図は読んでいない）`;
})();
</script>
</body>
</html>
