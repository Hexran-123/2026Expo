name: 生成物が最新か確かめる

# 直したのに生成物を作り直していないと、配る側・見せる側だけ古いまま気づけない。
# .githooks/pre-commit（手元）を入れ忘れた、あるいは並行して作業していた
# セッションの取りこぼしを、ここで拾う。
#
#   demo/*.html                 css・js・data から作る1枚デモ
#   board.html                  テンプレート・data/board・board-spots.json・board-posts.json から作る
#
# どちらも 14.8MB の標高格子（.gitignore 済み）を必要としない作りにしてあるので、
# clone したままの CI で走る。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check-generated-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 1枚デモ（demo/*.html）
        run: node tools/check-demo-fresh.js
      - name: 絶景掲示板（board.html）
        if: always()
        run: node tools/check-board-fresh.js
