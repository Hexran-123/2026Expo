name: demo が最新か確かめる

# css/・js/・data/ を直したのに demo/*.html（1 枚デモ 4 枚）が
# 作り直されていないと、配る側だけ古いまま気づけない。
# .githooks/pre-commit（手元）を入れ忘れた、あるいは並行して作業していた
# セッションの取りこぼしを、ここで拾う。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check-demo-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check-demo-fresh.js
